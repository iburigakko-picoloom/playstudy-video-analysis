name: Smoke test APK video playback

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Test the published v1.0.3 player before the frame fixes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    env:
      PLAYSTUDY_TEST_MIRROR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use v1.0.3 playback sources with current instrumentation
        if: inputs.baseline
        run: git restore --source=v1.0.3 -- public android/app/src/main/java/jp/playstudy/apk/MainActivity.java android/app/src/main/java/jp/playstudy/apk/LocalMediaServer.java
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare offline assets
        run: node scripts/prepare-android-assets.mjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            gradle -p android :app:connectedDebugAndroidTest --no-daemon || { adb logcat -d -s PlayStudy:D | tail -n 160; exit 1; }
            adb logcat -d -s FrameAudit:I | tail -n 8
