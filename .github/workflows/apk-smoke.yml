name: Smoke test APK video playback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install sample video generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Prepare offline assets and sample video
        run: |
          node scripts/prepare-android-assets.mjs
          mkdir -p android/app/src/main/assets/test
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=15 -t 2 -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -movflags +faststart android/app/src/main/assets/test/sample.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            result=0
            gradle -p android :app:connectedDebugAndroidTest --no-daemon || result=$?
            adb logcat -d -s PlayStudy:D | tail -n 160 || true
            exit "$result"
