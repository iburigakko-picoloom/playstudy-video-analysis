<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="playstudy-root" content="/">
  <title>PlayStudyの起動を修復</title>
  <style>
    body{margin:0;padding:32px 24px;font:16px/1.7 system-ui,sans-serif;color:#172338;background:#f6f8fb}
    main{max-width:440px;margin:8vh auto}h1{font-size:24px}button,a{font:inherit}
    button,.open{display:block;box-sizing:border-box;width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#2f6df6;color:white;text-align:center;text-decoration:none}
    button:disabled{opacity:.6}[hidden]{display:none!important}
  </style>
  <script src="/pwa.js?v=34"></script>
</head>
<body><main>
  <h1>PlayStudyの起動を修復</h1>
  <p>起動に必要な画面を読み込み直します。保存した動画・メモは削除しません。</p>
  <p id="status" role="status" aria-live="polite">通信できる状態で実行してください。</p>
  <button id="repair">起動を修復する</button>
  <a id="open" class="open" hidden>PlayStudyを開く</a>
  <p id="done" hidden>準備ができました。ホーム画面に戻り、いつものアイコンからも起動を試せます。</p>
</main>
<script>
  document.querySelector('#repair').onclick = async () => {
    const button = document.querySelector('#repair');
    const status = document.querySelector('#status');
    button.disabled = true;
    status.textContent = '起動に必要なデータを読み込んでいます…';
    try {
      const result = await window.playStudyPWA.repair();
      status.textContent = '起動準備が完了しました';
      document.querySelector('#open').href = result.url;
      document.querySelector('#open').hidden = false;
      document.querySelector('#done').hidden = false;
      button.hidden = true;
    } catch (error) {
      status.textContent = error.message || '修復できませんでした。通信を確認してください。';
    } finally { button.disabled = false; }
  };
</script></body></html>
